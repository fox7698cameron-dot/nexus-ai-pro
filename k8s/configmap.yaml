---
# ================================================
# NEXUS AI PRO - ConfigMap
# Non-sensitive runtime configuration
# ================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus
  labels:
    app: nexus-ai-pro
    version: "3.0.0"
    component: config
  annotations:
    description: "Shared non-sensitive configuration for all Nexus AI Pro services"
data:
  # ── Server ────────────────────────────────────
  NODE_ENV: "production"
  PORT: "3001"
  PORT_PYTHON: "8000"
  PORT_BUN: "3002"
  LOG_LEVEL: "info"

  # ── CORS ──────────────────────────────────────
  # Override CORS_ORIGIN with your actual frontend domain in production
  CORS_ORIGIN: "*"

  # ── Rate limiting ─────────────────────────────
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"

  # ── AI timeouts (ms) ──────────────────────────
  AI_REQUEST_TIMEOUT_MS: "30000"
  AI_MAX_TOKENS_DEFAULT: "4096"

  # ── Feature flags ─────────────────────────────
  ENABLE_WEBSOCKET: "true"
  ENABLE_AUTO_PATCH: "true"
  ENABLE_ENCRYPTION: "true"
  SECURITY_SCAN_INTERVAL_MS: "3600000"

  # ── Observability ─────────────────────────────
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_PATH: "/api/health"
