---
# ================================================
# NEXUS AI PRO - Bun Server Deployment
# Port: 3002 | Replicas: 2
# ================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-bun
  namespace: nexus
  labels:
    app: nexus-ai-pro
    version: "3.0.0"
    component: backend-bun
    tier: backend
  annotations:
    deployment.kubernetes.io/revision: "1"
    description: "Nexus AI Pro — Bun TypeScript backend server with native WebSocket"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: nexus-ai-pro
      component: backend-bun
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nexus-ai-pro
        version: "3.0.0"
        component: backend-bun
        tier: backend
    spec:
      # ── Security context ────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 1002
        fsGroup: 1002
        seccompProfile:
          type: RuntimeDefault

      # ── Topology spread ─────────────────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              component: backend-bun

      terminationGracePeriodSeconds: 30

      containers:
        - name: nexus-bun
          image: nexus-ai-pro:bun-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
            - name: ws
              containerPort: 3002
              protocol: TCP
            - name: metrics
              containerPort: 9092
              protocol: TCP

          # ── Environment ──────────────────────────
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets

          env:
            - name: PORT_BUN
              value: "3002"
            - name: NODE_ENV
              value: "production"
            - name: BUN_ENV
              value: "production"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # ── Resource limits ───────────────────────
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # ── Probes ────────────────────────────────
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3002
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3002
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/health
              port: 3002
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 10

          # ── Container security ────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # ── Volume mounts ─────────────────────────
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs

      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
