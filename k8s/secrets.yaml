  namespace: nexus
  labels:
    app: nexus-ai-pro
    version: "3.0.0"
    component: secrets
  annotations:
    description: "API keys and sensitive credentials for Nexus AI Pro"
    # Uncomment when using cert-manager + external-secrets:
    # secrets.hashicorp.com/vault-path: "secret/nexus-ai-pro"
type: Opaque
data:
  # ── JWT / Session ─────────────────────────────
  # echo -n "change-me-minimum-32-char-jwt-secret" | base64
  JWT_SECRET: Y2hhbmdlLW1lLW1pbmltdW0tMzItY2hhci1qd3Qtc2VjcmV0

  # ── Encryption ────────────────────────────────
  # echo -n "change-me-encryption-secret-32chars" | base64
