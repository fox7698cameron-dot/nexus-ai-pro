# ================================================
# NEXUS AI PRO - Secret Template
#
# IMPORTANT: Replace all base64 placeholder values
# before applying to your cluster.
#
# To encode a value:
#   echo -n "your-secret" | base64
#
# To apply without committing secrets to git,
# use external-secrets, Sealed Secrets, or Vault.
# ================================================
