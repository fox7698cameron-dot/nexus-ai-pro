# ================================================
# NEXUS AI PRO - Prometheus Configuration
# Metrics collection and alerting
# ================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'nexus-ai-pro'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Nexus AI Pro backend — custom /metrics endpoint
  - job_name: 'nexus-ai'
    static_configs:
      - targets: ['nexus-ai:3001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
